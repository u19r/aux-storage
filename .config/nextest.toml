[profile.default]
default-filter = 'not package(cucumber-tests) and not binary(remote_canary_fixture)'
# A test that does not end is terminated after 10 minutes so one hang cannot hold a gate.
slow-timeout = { period = "60s", terminate-after = 10 }

# Exact cost pins (wave, read and WAL counts) measure one operation on a shared FoundationDB cluster
# or Postgres database: a concurrent test's schema change or commits move those counts. Each pin
# runs alone, holding every test slot.
[[profile.default.overrides]]
filter = 'package(storage-rewrite-conformance) and test(/census|when_measured/)'
threads-required = "num-test-threads"
