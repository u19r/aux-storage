[package]
rust-version.workspace = true
publish = false
name = "storage-common"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Backend-agnostic shared helpers for storage providers (pagination, projection, key schema validation, retry logic)"

[features]
fault-injection = []
rocksdb = ["storage-types/rocksdb"]

[dependencies]
futures = { workspace = true }
metrics = { workspace = true }
metrics-facade = { workspace = true }
scheduled-bg-jobs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
storage-types = { path = "../storage-types" }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
alloc-counter = { workspace = true }
anyhow = { workspace = true }
quint-connect = { workspace = true }
storage-types = { path = "../storage-types", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
