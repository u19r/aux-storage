[package]
rust-version.workspace = true
edition = "2024"
license.workspace = true
name = "storage-api"
version = "0.1.0"

[lib]
doctest = false

[features]
default = ["sqlite"]
sqlite = ["storage/sqlite", "storage-types/sqlite"]
turso = ["storage/turso", "storage-types/turso"]
postgres = ["storage/postgres", "storage-types/postgres"]
rocksdb = ["storage/rocksdb", "storage-types/rocksdb"]
foundationdb = ["storage/foundationdb"]
queue = ["dep:queue", "dep:queue-provider"]
pubsub = ["dep:pubsub"]
remote = ["storage/remote"]
regional = ["storage/regional"]
test-support = ["storage/test-support"]
tokio-console = ["dep:console-subscriber"]
internal-test-routes = []

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
config = { path = "../config" }
console-subscriber = { version = "0.5.0", optional = true }
futures = { workspace = true }
http-error = { path = "../http-error" }
http-request = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-facade = { workspace = true }
notify = { workspace = true, default-features = true }
pubsub = { path = "../pubsub", default-features = false, optional = true }
queue = { path = "../queue", default-features = false, optional = true }
queue-provider = { path = "../queue-provider", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
storage = { path = "../storage", default-features = false }
storage-backfill = { path = "../storage-backfill" }
storage-common = { path = "../storage-common" }
storage-condition = { path = "../storage-condition" }
storage-provider = { path = "../storage-provider" }
storage-types = { path = "../storage-types", default-features = false }
stream-provider = { path = "../stream-provider" }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
alloc-counter = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
cpu-time = { workspace = true }
httpmock = { workspace = true }
queue-remote = { path = "../queue-remote" }
regional-replication = { path = "../regional-replication" }
replication-provider = { workspace = true }
replication-types = { path = "../replication-types" }
reqwest = { workspace = true }
rusqlite = { workspace = true }
scheduled-bg-jobs = { workspace = true }
storage = { path = "../storage", default-features = false, features = ["test-support"] }
storage-observability-test-support = { path = "../storage-observability-test-support" }
tempfile = { workspace = true }
tokio-postgres = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
yaml_serde = "0.10.7"

[[test]]
name = "scheduled_job_store_remote"
path = "tests/scheduled_job_store_remote_tests.rs"
required-features = ["remote", "sqlite", "queue"]

[[test]]
name = "remote_canary_fixture"
path = "tests/remote_canary_fixture_tests/mod.rs"
harness = false
required-features = ["remote", "sqlite", "queue"]

[[test]]
name = "remote_canary_lifecycle"
path = "tests/remote_canary_lifecycle_tests/mod.rs"
required-features = ["remote", "sqlite", "queue"]

[[test]]
name = "regional_http"
path = "tests/regional_http_tests/mod.rs"
required-features = ["regional", "test-support"]

[[test]]
name = "query_source_remote"
path = "tests/query_source_remote_tests.rs"
required-features = ["remote", "sqlite"]

[[test]]
name = "queue_publication_remote"
path = "tests/queue_publication_remote_tests.rs"
required-features = ["remote", "sqlite", "queue", "test-support"]

[lints]
workspace = true
