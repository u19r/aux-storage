openapi: 3.1.0
info:
  title: Storage API
  description: ''
  license:
    name: BUSL-1.1
    identifier: BUSL-1.1
  version: 0.1.0
paths:
  /pubsub:
    post:
      tags:
      - crate::routes::pubsub
      operationId: pubsub_endpoint
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: string
        required: true
      responses:
        '404':
          description: Pubsub route is not enabled in this binary
  /queue:
    post:
      tags:
      - crate::routes::queue
      operationId: queue_endpoint
      requestBody:
        content:
          application/x-amz-json-1.0:
            schema:
              type: string
        required: true
      responses:
        '404':
          description: Queue route is not enabled in this binary
  /storage:
    post:
      tags:
      - crate::routes::dynamodb
      summary: Execute a DynamoDB-compatible storage operation.
      description: Sends a DynamoDB-compatible JSON-RPC request through the storage API using the `x-amz-target` header. The Aux action `DynamoDB_20120810.QuerySourcePage` accepts a snake_case QueryTableRequest and returns unprojected source images, independently decoded physical keys, bounded evaluation progress and an opaque continuation. It preserves stored-entity identity validation across remote storage; ordinary Query remains unchanged. The Aux action `DynamoDB_20120810.GetCanonicalHistory` supports source discovery, scoped canonical views, native checkpoints and causal delivery on configured regional services. Its typed history request uses snake_case fields and rejects unknown fields; cursors remain bound to their serving receiver and selection.
      operationId: dynamodb_endpoint
      parameters:
      - name: x-amz-target
        in: header
        description: DynamoDB operation target (e.g., DynamoDB_20120810.CreateTable)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: DynamoDB operation successful
          content:
            application/json:
              schema: {}
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admission overloaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-aux-audience: internal_private
      x-aux-internal: true
components:
  schemas:
    AttributeMap:
      type: object
      description: |-
        Equality treats attributes as a map; iteration and serialization retain
        insertion order.
      additionalProperties:
        $ref: '#/components/schemas/AttributeValue'
      propertyNames:
        type: string
    AttributeValue:
      oneOf:
      - type: object
        required:
        - S
        properties:
          S:
            type: string
      - type: object
        required:
        - N
        properties:
          N:
            type: string
      - type: object
        required:
        - B
        properties:
          B:
            type: string
      - type: object
        required:
        - SS
        properties:
          SS:
            type: array
            items:
              type: string
      - type: object
        required:
        - NS
        properties:
          NS:
            type: array
            items:
              type: string
      - type: object
        required:
        - BS
        properties:
          BS:
            type: array
            items:
              type: string
      - type: object
        required:
        - BOOL
        properties:
          BOOL:
            type: boolean
      - type: object
        required:
        - 'NULL'
        properties:
          'NULL':
            type: boolean
      - type: object
        required:
        - L
        properties:
          L:
            type: array
            items:
              $ref: '#/components/schemas/AttributeValue'
      - type: object
        required:
        - M
        properties:
          M:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/AttributeValue'
            propertyNames:
              type: string
    DynamoDbCancellationReason:
      type: object
      required:
      - Code
      properties:
        Code:
          type: string
        Item:
          oneOf:
          - $ref: '#/components/schemas/AttributeMap'
          - type: 'null'
        Message:
          type:
          - string
          - 'null'
    ErrorResponse:
      type: object
      required:
      - __type
      properties:
        CancellationReasons:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DynamoDbCancellationReason'
          description: DynamoDB transaction cancellation reasons.
        Item:
          oneOf:
          - $ref: '#/components/schemas/AttributeMap'
            description: DynamoDB item returned by ReturnValuesOnConditionCheckFailure.
          - type: 'null'
        Message:
          type:
          - string
          - 'null'
          description: DynamoDB transaction cancellation message field.
        __type:
          type: string
          description: |-
            AWS-compatible JSON error field name. DynamoDB and SQS JSON protocol
            errors use `__type`. Machine-readable API error type.
          example: ValidationException
        documentation_url:
          type:
          - string
          - 'null'
          description: Optional documentation link for operator or developer remediation.
          example: /docs/explanations/error-code-catalog
        message:
          type: string
          description: |-
            AWS-compatible JSON error field name. DynamoDB and SQS JSON protocol
            errors use `message`. Human-readable error message.
          example: One or more parameter values were invalid.
        request_id:
          type:
          - string
          - 'null'
          description: Request correlation identifier echoed in the response body.
          example: 018f1f61-2a6f-7ac3-b9b6-7f65bb2d91fd
        retry_after_seconds:
          type:
          - integer
          - 'null'
          format: int64
          description: Optional retry budget for rate-limited responses.
          example: 2
          minimum: 0
