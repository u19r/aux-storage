[package]
rust-version.workspace = true
publish = false
autotests = false
edition = "2024"
license.workspace = true
name = "pubsub"
version = "0.1.0"

[lib]
doctest = false

[features]
test-support = [
    "http-error/test-support",
    "pubsub-provider/test-support",
    "queue-provider/test-support",
    "storage-types/test-support",
    "stream-provider/test-support",
]
default = ["sqlite"]
sqlite = ["sql-backend/sqlite", "queue/sqlite"]
turso = ["sql-backend/turso", "queue/turso"]
postgres = ["sql-backend/postgres", "queue/postgres"]
rocksdb = ["kv-backend/rocksdb", "queue/rocksdb"]
foundationdb = ["kv-backend/foundationdb", "queue/foundationdb"]

[dependencies]
config = { path = "../config" }
futures-util = { workspace = true }
http-error = { path = "../http-error" }
http-request = { workspace = true }
metrics = { workspace = true }
pubsub-provider = { path = "../pubsub-provider" }
queue = { path = "../queue", default-features = false }
queue-provider = { path = "../queue-provider" }
serde = { workspace = true }
serde_json = { workspace = true }
storage-types = { path = "../storage-types" }
stream-provider = { path = "../stream-provider" }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
alloc-counter = { workspace = true }
anyhow = { workspace = true }
aws-config = { workspace = true }
aws-sdk-sns = { workspace = true }
http-error = { path = "../http-error", features = ["test-support"] }
kv-backend = { path = "../kv-backend", default-features = false }
pubsub-provider = { path = "../pubsub-provider", features = ["test-support"] }
queue-provider = { path = "../queue-provider", features = ["test-support"] }
quint-connect = { workspace = true }
sql-backend = { path = "../sql-backend", default-features = false, features = ["test-support"] }
storage-types = { path = "../storage-types", features = ["test-support"] }
stream-provider = { path = "../stream-provider", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[test]]
name = "aws_parity_tests"
path = "tests/aws_parity_tests/mod.rs"
