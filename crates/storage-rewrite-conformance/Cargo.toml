[package]
rust-version.workspace = true
publish = false
edition = "2024"
license.workspace = true
name = "storage-rewrite-conformance"
version = "0.1.0"

[lib]
doctest = false

[features]
default = ["sqlite"]
sqlite = ["sql-backend/sqlite", "sql-backend/fault-injection"]
turso = ["sql-backend/turso", "sql-backend/fault-injection"]
rocksdb = ["kv-backend/rocksdb", "kv-backend/fault-injection"]
postgres = ["sql-backend/postgres", "sql-backend/fault-injection"]
foundationdb = [
    "kv-backend/foundationdb",
    "kv-backend/test-support",
    "kv-backend/fault-injection",
]

[dev-dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bg-job-store = { path = "../bg-job-store" }
bytes = { workspace = true }
futures = { workspace = true }
http-error = { path = "../http-error", features = ["test-support"] }
http-request = { workspace = true }
kv-backend = { path = "../kv-backend", default-features = false }
metrics = { workspace = true }
pubsub = { path = "../pubsub", default-features = false }
pubsub-provider = { path = "../pubsub-provider", features = ["test-support"] }
queue = { path = "../queue", default-features = false }
queue-provider = { path = "../queue-provider", features = ["test-support"] }
regional-replication = { path = "../regional-replication" }
scheduled-bg-jobs = { workspace = true }
scheduled-bg-jobs-conformance = { workspace = true }
serde_json = { workspace = true }
sql-backend = { path = "../sql-backend", default-features = false }
storage-backfill = { path = "../storage-backfill" }
storage-common = { path = "../storage-common" }
storage-observability-test-support = { path = "../storage-observability-test-support" }
storage-provider = { path = "../storage-provider", features = ["test-support"] }
storage-types = { path = "../storage-types", features = ["test-support"] }
stream-provider = { path = "../stream-provider", features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-postgres = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
