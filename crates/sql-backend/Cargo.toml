[package]
rust-version.workspace = true
publish = false
edition = "2024"
license.workspace = true
name = "sql-backend"
version = "0.1.0"

[lib]
doctest = false

[features]
default = []
fault-injection = []
sqlite = ["dep:rusqlite", "dep:tokio", "dep:tokio-rusqlite"]
postgres = [
    "dep:deadpool-postgres",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
]
turso = ["dep:tokio", "dep:turso"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bg-job-store = { path = "../bg-job-store" }
bytes = { workspace = true }
deadpool-postgres = { workspace = true, optional = true }
futures = { workspace = true }
infrastructure-provider = { workspace = true }
pubsub-provider = { path = "../pubsub-provider" }
queue-provider = { path = "../queue-provider" }
rusqlite = { workspace = true, optional = true, features = ["limits"] }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
scheduled-bg-jobs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
storage-backfill = { path = "../storage-backfill" }
storage-common = { path = "../storage-common" }
storage-condition = { path = "../storage-condition" }
storage-provider = { path = "../storage-provider" }
storage-types = { path = "../storage-types", default-features = false }
stream-provider = { path = "../stream-provider" }
tokio = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
tokio-rusqlite = { workspace = true, optional = true }
tracing = { workspace = true }
turso = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
alloc-counter = { workspace = true }
cpu-time = { workspace = true }

[lints]
workspace = true
