[package]
rust-version.workspace = true
publish = false
autotests = false
edition = "2024"
license.workspace = true
name = "queue"
version = "0.1.0"

[lib]
doctest = false

[features]
default = ["sqlite"]
sqlite = ["sql-backend/sqlite", "storage-types/sqlite"]
turso = ["sql-backend/turso", "storage-types/turso"]
postgres = ["sql-backend/postgres", "storage-types/postgres"]
rocksdb = ["kv-backend/rocksdb", "storage-types/rocksdb"]
foundationdb = ["kv-backend/foundationdb"]
opt-loop-profiling = ["dep:opt-loop-probe"]

[dependencies]
async-trait = { workspace = true }
bg-jobs-tokio = { workspace = true }
md5 = { workspace = true }
metrics-facade = { workspace = true }
opt-loop-probe = { workspace = true, optional = true }
queue-provider = { path = "../queue-provider" }
serde_json = { workspace = true }
storage-types = { path = "../storage-types" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
kv-backend = { path = "../kv-backend", default-features = false }
queue-provider = { path = "../queue-provider", features = ["test-support"] }
quint-connect = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sql-backend = { path = "../sql-backend", default-features = false, features = ["test-support"] }
storage-observability-test-support = { path = "../storage-observability-test-support" }
storage-provider = { path = "../storage-provider" }
storage-types = { path = "../storage-types", features = ["test-support"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

