[package]
name = "replication-contract-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[features]
native = [
    "dep:axum",
    "dep:pubsub",
    "dep:bg-job-store",
    "dep:pubsub-provider",
    "dep:queue-provider",
    "dep:scheduled-bg-jobs",
    "dep:storage-provider",
    "dep:storage-common",
    "dep:stream-provider",
    "dep:tracing-subscriber",
]
native-sqlite = ["native", "dep:sql-backend", "sql-backend/sqlite", "dep:rusqlite"]
native-postgres = [
    "native",
    "dep:sql-backend",
    "sql-backend/postgres",
    "dep:tokio-postgres",
    "dep:url",
]
native-turso = ["native", "dep:sql-backend", "sql-backend/turso"]
native-rocksdb = ["native", "dep:kv-backend", "kv-backend/rocksdb"]
native-foundationdb = ["native", "dep:kv-backend", "kv-backend/foundationdb"]
[dependencies]
axum = { workspace = true, optional = true }
bg-job-store = { path = "../bg-job-store", optional = true }
bytes.workspace = true
futures.workspace = true
infrastructure-provider.workspace = true
kv-backend = { path = "../kv-backend", optional = true, features = ["fault-injection"] }
pubsub = { path = "../pubsub", optional = true, default-features = false }
pubsub-provider = { path = "../pubsub-provider", optional = true }
queue-provider = { path = "../queue-provider", optional = true }
replication-provider.workspace = true
replication-types.workspace = true
rusqlite = { workspace = true, optional = true }
scheduled-bg-jobs = { workspace = true, optional = true, features = ["test-support"] }
serde.workspace = true
serde_json.workspace = true
sql-backend = { path = "../sql-backend", optional = true, features = ["fault-injection"] }
storage-common = { path = "../storage-common", optional = true }
storage-provider = { path = "../storage-provider", optional = true }
storage-types.workspace = true
stream-provider = { path = "../stream-provider", optional = true }
tempfile.workspace = true
tokio.workspace = true
tokio-postgres = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid.workspace = true
[lints]
workspace = true
