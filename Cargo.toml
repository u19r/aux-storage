[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
rust-version = "1.99.1"
edition = "2024"
repository = "https://github.com/u19r/aux-storage"
readme = "README.md"
description = "Storage, queue, and pubsub compatible services and libraries."
keywords = ["storage", "queue", "pubsub", "sqlite"]
categories = []
license = "BUSL-1.1"

[workspace.dependencies]
cpu-time = "1.0.0"
############################################
# rust-random
rand = "0.10.3"

############################################
# tokio-rs
axum = "0.8.9"
deadpool-postgres = "0.14.2"
rustls = "0.23.46"
rustls-native-certs = "0.8.5"
tokio = { version = "1.54.1", features = ["full", "tracing"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

############################################
# futures-rs (rust-lang)
futures = "0.3.34"
futures-util = "0.3.34"

############################################
# hyperium
bytes = "1.12.1"
concurrent-queue = "2.5.0"
http = "1.5.0"
httpdate = "1.0.3"
tower-http = { version = "0.7.1", features = ["catch-panic", "cors"] }

############################################
# serde-rs
md5 = "0.8.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
url = "2.5.8"

############################################
# awslabs
aws-config = "1.13.0"
aws-credential-types = "1.3.1"
aws-sdk-dynamodb = { version = "1.134.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "1.119.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1.117.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = "1.6.3"
aws-smithy-runtime-api = "1.19.1"
aws-smithy-types = "1.9.0"

############################################
# dtolnay
anyhow = "1.0.104"
async-trait = "0.1.92"
inventory = "0.3.25"
proc-macro2 = "1.0.107"
quote = "1.0.47"
self_cell = "1.3.0"
syn = { version = "3.0.9", features = ["full"] }
thiserror = "2.0.21"

############################################
# marshallpierce
base64 = "0.23.1"
hex = "0.4.3"

############################################
# chrono-rs
chrono = { version = "0.4.45", features = ["clock", "serde"] }

############################################
# cucumber-rs
cucumber = "0.23.0"

############################################
# seanmonstar
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "multipart", "query", "rustls", "stream"] }

############################################
# rust-rocksdb
rocksdb = { version = "0.25.0", features = ["multi-threaded-cf"] }

############################################
# clap-rs
clap = { version = "4.6.7", features = ["derive"] }

############################################
# uuid-rs
uuid = { version = "1.29.0", features = ["serde", "v4", "v5", "v7"] }

############################################
# idanarye
tempfile = "3.27.0"
typed-builder = "0.23.2"

############################################
# Other / standalone
base32 = "0.5.1"
cargo_metadata = "0.23.1"
# Keep the native client, tuple codec, and simulation API on one upstream revision.
foundationdb = { version = "0.11.0", features = ["embedded-fdb-include", "fdb-7_4"], git = "https://github.com/foundationdb-rs/foundationdb-rs.git", rev = "9c91ad4fc84836a51f6544ea7c60c784f4d9b6f3" }
foundationdb-simulation = { version = "0.3.0", features = ["embedded-fdb-include", "fdb-7_4"], git = "https://github.com/foundationdb-rs/foundationdb-rs.git", rev = "9c91ad4fc84836a51f6544ea7c60c784f4d9b6f3" }
foundationdb-tuple = { version = "0.11.0", git = "https://github.com/foundationdb-rs/foundationdb-rs.git", rev = "9c91ad4fc84836a51f6544ea7c60c784f4d9b6f3" }
hostname = "0.4.2"
httpmock = "0.9.0"
ipnet = "2.12.2"
jsonschema = { version = "0.60.1", default-features = false, features = ["resolve-file"] }
lz4_flex = "0.14.0"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
notify = "8.2.0"
proptest = "1.12.0"
quint-connect = "=0.1.2"
rust_decimal = "1.43.0"
schemars = "1.2.3"
smallvec = { version = "1.16.4", features = ["serde"] }
toml = "1.1.8"
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
turso = { version = "0.8.3", default-features = false }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

############################################
# Shared crates pinned to a published aux-common revision.
alloc-counter = { git = "https://github.com/u19r/aux-common", rev = "662da2358c5c2bebecc85dd892c45deb825eabc6" }
alloc-counter-macros = { git = "https://github.com/u19r/aux-common", rev = "662da2358c5c2bebecc85dd892c45deb825eabc6" }
aws-sigv4-signing = { git = "https://github.com/u19r/aux-common", rev = "662da2358c5c2bebecc85dd892c45deb825eabc6" }
http-request = { git = "https://github.com/u19r/aux-common", rev = "662da2358c5c2bebecc85dd892c45deb825eabc6" }
lru-ttl-cache = { git = "https://github.com/u19r/aux-common", rev = "662da2358c5c2bebecc85dd892c45deb825eabc6" }
metrics-facade = { git = "https://github.com/u19r/aux-common", rev = "662da2358c5c2bebecc85dd892c45deb825eabc6" }
opt-loop-probe = { git = "https://github.com/u19r/aux-common", rev = "662da2358c5c2bebecc85dd892c45deb825eabc6" }

# Scheduled jobs use the shared aux-common contract; storage owns provider adapters.
bg-jobs-tokio = { package = "bg-jobs-tokio", version = "0.2.0", git = "https://github.com/u19r/aux-common", rev = "662da2358c5c2bebecc85dd892c45deb825eabc6" }
scheduled-bg-jobs = { package = "bg-jobs", version = "0.2.0", git = "https://github.com/u19r/aux-common", rev = "662da2358c5c2bebecc85dd892c45deb825eabc6" }
scheduled-bg-jobs-conformance = { package = "bg-jobs-conformance", version = "0.1.0", git = "https://github.com/u19r/aux-common", rev = "662da2358c5c2bebecc85dd892c45deb825eabc6" }

############################################
# Local path dependencies
infrastructure-provider = { path = "crates/infrastructure-provider" }
replication-provider = { path = "crates/replication-provider" }
replication-types = { path = "crates/replication-types" }
storage-types = { path = "crates/storage-types" }
tokio-rusqlite = { path = "vended/tokio-rusqlite" }

rusqlite = { version = "0.41.0", features = ["backup", "bundled", "hooks", "uuid"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
string_slice = "deny"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
implicit_hasher = "allow"
match_same_arms = "allow"
cargo_common_metadata = "allow"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
unused_must_use = "warn"

[profile.test]
opt-level = 0
debug = 0
lto = false
codegen-units = 256
incremental = false

[profile.test.package.turso_core]
opt-level = 1

[profile.test.package.turso_parser]
opt-level = 1

[profile.release]
opt-level = "z"
codegen-units = 1
overflow-checks = true
panic = "unwind"
lto = "fat"
strip = "symbols"

[profile.fast-release]
inherits = "release"
opt-level = 1
codegen-units = 256
lto = false

[profile.profiling]
inherits = "release"
debug = true
strip = false
lto = false
codegen-units = 1
split-debuginfo = "packed"

[profile.dev]
lto = false
debug-assertions = true
opt-level = 0
strip = "none"
debug = 0
incremental = false
codegen-units = 256

# Turso's recursive SQL parser and translator exhaust ordinary thread stacks
# without optimization, including bounded infrastructure reads during enable.
[profile.dev.package.turso_core]
opt-level = 1

[profile.dev.package.turso_parser]
opt-level = 1
